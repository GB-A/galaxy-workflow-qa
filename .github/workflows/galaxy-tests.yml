name: Galaxy integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  galaxy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GALAXY_TEST_USERNAME: ${{ vars.GALAXY_TEST_USERNAME }}
      GALAXY_TEST_PASSWORD: ${{ secrets.GALAXY_TEST_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      #- name: Set up Java for Allure2
        #uses: actions/setup-java@v4
        #with:
        #  distribution: temurin
         # java-version: "17"

      - name: Setup Node.js (for Allure 3 CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps

      - name: Install Allure CLI
        run: npm install -D allure

      - name: Start Galaxy container
        run: |
          docker run --detach \
            --name galaxy-ci \
            --publish 8080:80 \
            --env GALAXY_DEFAULT_ADMIN_USER="${GALAXY_TEST_USERNAME}" \
            --env GALAXY_DEFAULT_ADMIN_EMAIL=admin@galaxy.org \
            --env GALAXY_DEFAULT_ADMIN_PASSWORD="${GALAXY_TEST_PASSWORD}" \
            --env GALAXY_DEFAULT_ADMIN_KEY=fakekey \
            --env GALAXY_CONFIG_ADMIN_USERS=admin@galaxy.org \
            quay.io/bgruening/galaxy:latest

      - name: Wait for Galaxy to become ready
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/version >/dev/null 2>&1; then
              echo "Galaxy is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Galaxy did not become ready within 10 minutes."
          docker logs galaxy-ci
          exit 1

      - name: Run pytest suite
      # Always continue so the report is generated even if tests fail
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --auto-servernum pytest -p allure_pytest_bdd --alluredir=reports/allure-results --clean-alluredir

      - name: Generate Allure HTML report
        if: always()
        run: |
          if find reports/allure-results -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            npx allure generate reports/allure-results --output reports/allure-html-report --clean
          else
            echo "No Allure test results were generated."
          fi
      
      - name: Post Allure Summary to PR
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "reports/allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sections: |
            new
            flaky

      - name: Upload Allure results and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            reports/allure-results/
            reports/allure-html-report/
          if-no-files-found: warn
          retention-days: 14
     # --- GitHub Pages Deployment Steps ---
      - name: Upload artifact for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-html-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
      # -------------------------------------
      - name: Show Galaxy logs on failure
        if: failure()
        run: docker logs galaxy-ci

      - name: Stop Galaxy container
        if: always()
        run: |
          if docker container inspect galaxy-ci >/dev/null 2>&1; then
            docker rm --force galaxy-ci
          fi
