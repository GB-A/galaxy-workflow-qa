[pytest]
bdd_features_base_dir = functional_playwright/features
markers =
    sanity: sanity tests
    smoke: quick checks that verify the Galaxy test environment is available
    api: tests that exercise the Galaxy API
    ui: tests that exercise the Galaxy user interface
    regression: tests that guard against previously fixed defects
    slow: tests that take significantly longer to run
    p1: high-priority test
    req(requirement_id): maps a test to a requirement ID, such as REQ_001
    tc_ui(TestCase_ui_id): maps a test to testcase Id such as TC_UI_001

# ------------------------
# Test Grouping(Markers)
# ------------------------
# Use one of the following when running tests:
# -m "sanity"
# -m "regression"
# -m "sanity and regression"
# -m "sanity or regression"
# -m "sanity and not regression"
# -m "regression and not sanity"

addopts =
    -v
    --base-url=http://localhost:8080
    --html=reports/myreport.html
    --self-contained-html
    --alluredir=reports/allure-results
    --capture=tee-sys

# Optional pytest-playwright settings; uncomment and configure as needed.
#    
#    --browser=webkit
#    --browser-channel=CHANNEL
#    --slowmo=MILLISECONDS
#    --device=DEVICE_NAME
#    --output=test-results
#    --tracing=retain-on-failure
#    --video=retain-on-failure
#    --screenshot=only-on-failure
#    --full-page-screenshot

# --------------------
# --------------------
# Optional flaky-test settings (require pytest-rerunfailures)
# --------------------
#    --reruns=2
#    --reruns-delay=1
